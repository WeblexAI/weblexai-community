name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, exif, gd, intl, mbstring, pcntl, pdo_pgsql, redis, sodium, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: composer quality

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/e2e/run.sh

  artifacts:
    needs: [quality, docker-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-dev --prefer-dist --classmap-authoritative
      - run: npm ci && npm run build
      - name: Verify release signing key is configured
        shell: bash
        run: |
          if [ -z "${RELEASE_PRIVATE_KEY:-}" ]; then
            echo "::error::RELEASE_PRIVATE_KEY secret is not set. Add it to repository secrets before publishing a release." >&2
            exit 1
          fi
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
      - name: Create source archive outside the workspace
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=storage/logs \
            --exclude=storage/app/installation.lock \
            --exclude=storage/app/update.lock \
            --exclude='tests/e2e/*.runtime*' \
            -czf "${RUNNER_TEMP}/weblexai-community-${version}.tar.gz" .
          mv "${RUNNER_TEMP}/weblexai-community-${version}.tar.gz" .
      - run: sha256sum weblexai-community-*.tar.gz > SHA256SUMS
      - name: Sign release manifest
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="weblexai-community-${version}.tar.gz"
          sha="$(cut -d' ' -f1 SHA256SUMS)"
          php scripts/sign-release-manifest.php \
            --version="$version" \
            --artifact-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${artifact}" \
            --sha256="$sha" \
            --notes-url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --output=stable.json
      - name: Build versioned installer
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s|app_version=\"\${WEBLEX_VERSION:-__WEBLEX_VERSION__}\"|app_version=\"\${WEBLEX_VERSION:-${version}}\"|" deployment/install.sh > install.sh
          chmod 0755 install.sh
      - name: Verify versioned installer guard
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "WEBLEX_VERSION:-${version}" install.sh
          test "$(grep -c '__WEBLEX_VERSION__' install.sh)" = "1"
          grep -q 'if \[ "$app_version" = "__WEBLEX_VERSION__" \]; then' install.sh
          sh -n install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            weblexai-community-*.tar.gz
            SHA256SUMS
            stable.json
            install.sh
            docker-compose.yml
            docker-compose.tls.yml
            Caddyfile.tls
            scripts/backup-docker.sh
            scripts/restore-docker.sh

  image:
    needs: [quality, docker-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weblexai-community" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=stable
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-agent-image:
    needs: [quality, docker-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/weblexai-community-update-agent" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=stable
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/update-agent/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-public-images:
    needs: [image, update-agent-image]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker pull "ghcr.io/${owner}/weblexai-community:stable"
          docker pull "ghcr.io/${owner}/weblexai-community-update-agent:stable"

  publish:
    needs: [artifacts, verify-public-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Flatten nested assets for release upload
        shell: bash
        run: cp release/scripts/*.sh release/
      - name: Verify all release assets are present
        shell: bash
        run: |
          expected=(
            "weblexai-community-*.tar.gz"
            "SHA256SUMS"
            "stable.json"
            "install.sh"
            "docker-compose.yml"
            "docker-compose.tls.yml"
            "Caddyfile.tls"
            "backup-docker.sh"
            "restore-docker.sh"
          )
          for pattern in "${expected[@]}"; do
            if ! compgen -G "release/${pattern}" > /dev/null; then
              echo "::error::Missing release asset: ${pattern}" >&2
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
