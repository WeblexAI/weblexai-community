services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBLEX_DOMAIN: ${WEBLEX_DOMAIN:?Set WEBLEX_DOMAIN in .env to enable HTTPS}
      WEBLEX_EMAIL: ${WEBLEX_EMAIL:-}
    volumes:
      - ./Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - weblex

volumes:
  caddy_data:
  caddy_config:
